name: Fetch Podcast RSS Feeds

on:
  schedule:
    # Runs every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: # allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; a newer run replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate podcasts.json
        run: python validate_podcasts.py

      - name: Fetch RSS feeds
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO_NAME" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            export FEED_BASE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/feeds"
          else
            export FEED_BASE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/feeds"
          fi
          python fetch_feeds.py
          python build_pages_index.py

      - name: Prepare Pages artifact
        run: |
          mkdir -p public/feeds
          cp -f feeds/*.xml public/feeds/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
