<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Podcast Feeds</title>
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <main>
    <h1>ARDSounds - Podcast RSS Feeds</h1>
    <p>Diese Seite listet einige RSS Feeds für Podcasts von ARDSounds (zuvor ARD Audiothek). <br> Falls du eigene Feeds erstellen willst, schau mal hier: https://github.com/gboeer/podcast_feed </p>
    <div class="controls">
      <label for="feed-search">Feeds durchsuchen</label>
      <input id="feed-search" type="search" placeholder="Type podcast name or URL" autocomplete="off">
      <div id="feed-stats" class="stats"></div>
    </div>
    <ul>
__FEED_ITEMS__
    </ul>
    <footer>Generated at __GENERATED_AT__</footer>
  </main>
  <script>
    (function () {
      const input = document.getElementById("feed-search");
      const stats = document.getElementById("feed-stats");
      const items = Array.from(document.querySelectorAll("li[data-search]"));
      const total = items.length;

      function update() {
        const q = input.value.trim().toLowerCase();
        let visible = 0;
        for (const item of items) {
          const haystack = item.dataset.search || "";
          const match = q === "" || haystack.includes(q);
          item.style.display = match ? "" : "none";
          if (match) visible += 1;
        }
        stats.textContent = q ? `${visible} of ${total} feeds` : `${total} feeds`;
      }

      input.addEventListener("input", update);

      async function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return;
        }
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }

      document.addEventListener("click", async (event) => {
        const btn = event.target.closest(".copy-btn");
        if (!btn) return;
        const url = btn.dataset.copy || "";
        if (!url) return;
        try {
          await copyText(url);
          btn.classList.add("copied");
          btn.setAttribute("aria-label", "Copied");
          btn.setAttribute("title", "Copied");
          setTimeout(() => {
            btn.classList.remove("copied");
            btn.setAttribute("aria-label", "Copy feed URL");
            btn.setAttribute("title", "Copy feed URL");
          }, 1200);
        } catch (_err) {
          btn.setAttribute("title", "Copy failed");
        }
      });

      update();
    })();
  </script>
</body>
</html>
