<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Podcast Feeds</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8f8f5;
      --text: #1d1d1b;
      --muted: #555;
      --card: #fff;
      --line: #ddd;
      --accent: #0d5f9a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #ecebe6 0%, var(--bg) 30%);
      min-height: 100vh;
    }
    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }
    p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.5;
    }
    .controls {
      display: grid;
      gap: 8px;
    }
    input[type="search"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 1rem;
      background: #fff;
      color: var(--text);
    }
    .stats {
      color: var(--muted);
      font-size: 0.95rem;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 24px 0;
    }
    li {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    a {
      color: var(--accent);
      overflow-wrap: anywhere;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    footer {
      margin-top: 26px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>ARDSounds - Podcast RSS Feeds</h1>
    <p>Diese Seite listet einige RSS Feeds für Podcasts von ARDSounds (zuvor ARD Audiothek). <br> Falls du eigene Feeds erstellen willst, schau mal hier: https://github.com/gboeer/podcast_feed </p>
    <div class="controls">
      <label for="feed-search">Feeds durchsuchen</label>
      <input id="feed-search" type="search" placeholder="Type podcast name or URL" autocomplete="off">
      <div id="feed-stats" class="stats"></div>
    </div>
    <ul>
__FEED_ITEMS__
    </ul>
    <footer>Generated at __GENERATED_AT__</footer>
  </main>
  <script>
    (function () {
      const input = document.getElementById("feed-search");
      const stats = document.getElementById("feed-stats");
      const items = Array.from(document.querySelectorAll("li[data-search]"));
      const total = items.length;

      function update() {
        const q = input.value.trim().toLowerCase();
        let visible = 0;
        for (const item of items) {
          const haystack = item.dataset.search || "";
          const match = q === "" || haystack.includes(q);
          item.style.display = match ? "" : "none";
          if (match) visible += 1;
        }
        stats.textContent = q ? `${visible} of ${total} feeds` : `${total} feeds`;
      }

      input.addEventListener("input", update);
      update();
    })();
  </script>
</body>
</html>
